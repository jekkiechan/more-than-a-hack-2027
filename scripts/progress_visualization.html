<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#fff;color:#172033;font:14px system-ui,sans-serif}main{padding:16px;border:1px solid #dce3ec;border-radius:14px}header{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#475569}select{background:#fff;color:#172033;border:1px solid #b8c4d4;border-radius:7px;padding:7px;font:inherit}.legend{display:flex;gap:18px;align-items:center;margin-left:auto;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.chart{width:100%;min-height:310px;margin-top:10px}svg{display:block;overflow:visible}svg text{font:12px system-ui,sans-serif;fill:#526078}circle:focus{outline:none;stroke:#172033;stroke-width:3}button{background:transparent;border:1px solid #dce3ec;border-radius:6px;padding:6px 9px;font:inherit;cursor:pointer}.detail{background:#f4f7fb;border-radius:9px;padding:12px;line-height:1.6;min-height:74px}.detail strong{color:#172033}.empty{padding:30px;text-align:center}details{margin-top:12px}summary{cursor:pointer;color:#334155}.exact{margin-top:10px;display:grid;gap:8px}.row{display:grid;grid-template-columns:minmax(0,1fr) 68px 68px;gap:8px;padding:7px 0;border-top:1px solid #e7edf5}.row span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}.muted{color:#64748b;font-size:12px}.row small{display:block;color:#64748b}@media(max-width:480px){main{padding:12px}.legend{margin-left:0;width:100%}.detail{min-height:95px}.row{grid-template-columns:minmax(0,1fr) 58px 58px}}
</style></head><body><main>
<header><label id="view-label">View<select id="view"><option value="adoptions">Adoption milestones</option><option value="comparisons">Matched seed and context tests</option></select></label><label>Metric<select id="metric"><option value="spell">Possession spell F1</option><option value="macro">Frame macro F1</option></select></label><div class="legend" id="legend"></div></header>
<div class="chart" id="chart" aria-live="polite"></div><div class="detail" id="detail" aria-live="polite"></div>
<details><summary>Exact values and status</summary><div class="exact" id="exact"></div></details>
</main><script>
const MODE=__MODE__;
const FALLBACK=__DATA__;
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
let localState={}, pendingState=null, selected=null;
function state(){return pendingState || window.openai?.widgetState || localState || {}}
function dataset(){const d=state()?.modelContent?.data,keys=MODE==='public'?['checkpoints']:['adoptions','comparisons'];return d&&d.version===1&&keys.every(k=>Array.isArray(d[k])&&d[k].every(r=>r&&typeof r.id==='string'&&typeof r.label==='string'&&typeof r.date==='string'&&Number.isFinite(Date.parse(r.date))))?d:FALLBACK}
function ui(){const u=state()?.ui||{};return {metric:['spell','macro'].includes(u.metric)?u.metric:'spell',view:['adoptions','comparisons'].includes(u.view)?u.view:'adoptions'}}
function save(changes){const latest=state();localState={...latest,modelContent:{...(latest.modelContent||{}),data:dataset()},ui:{...ui(),...changes}};pendingState=localState;if(window.openai?.setWidgetState)window.openai.setWidgetState(localState);render()}
function node(tag,attrs={},text){const el=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;return el}
function textNode(tag,text,parent,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;parent.append(el);return el}
const val=(v)=>typeof v==='number'&&Number.isFinite(v)?v.toFixed(4):'Not scored';
function records(){const d=dataset(),u=ui();return MODE==='public'?(d.checkpoints||[]):(d[u.view]||[])}
function showDetail(row){if(!row)return;selected=row.id;const el=$('detail');el.replaceChildren();textNode('strong',row.label,el);textNode('span',' · '+row.date.slice(0,10),el);textNode('div',row.status,el,'muted');const k=ui().metric;textNode('div',MODE==='public'?`Public ${k==='spell'?'spell':'macro'} F1: ${val(row[k])}`:`Clean: ${val(row.clean?.[k])}  ·  Feed-like: ${val(row.feed_like?.[k])}`,el)}
function render(){
 const rows=records(),u=ui();$('metric').value=u.metric;$('view').value=u.view;$('view-label').hidden=MODE==='public';
 const keys=MODE==='public'?[['public','#315cc9','Public diagnostic']]:[['clean','#2458c7','Clean'],['feed_like','#b75116','Feed-like']];
 $('legend').replaceChildren();for(const [k,color,label]of keys){const s=document.createElement('span'),i=document.createElement('i');i.style.background=color;s.append(i,document.createTextNode(label));$('legend').append(s)}
 const host=$('chart');host.replaceChildren();if(!rows.length){textNode('div','No scores are available for this view.',host,'empty');$('detail').textContent='No results for the selected view.';$('exact').replaceChildren();return}
 const w=Math.max(270,host.clientWidth),h=310,p={left:38,right:22,top:25,bottom:64}, plotW=w-p.left-p.right,plotH=h-p.top-p.bottom;
 const svg=node('svg',{width:w,height:h,viewBox:`0 0 ${w} ${h}`,role:'img','aria-label':MODE==='public'?'Saved organizer score history':'Matched development scores by milestone'});host.append(svg);
 const times=rows.map(r=>Date.parse(r.date)),lo=Math.min(...times),hi=Math.max(...times);
 const x=i=>p.left+(rows.length===1?plotW/2:MODE==='public'&&hi>lo?(times[i]-lo)/(hi-lo)*plotW:i*plotW/(rows.length-1)),y=v=>p.top+(1-v)*plotH;
 for(let v=0;v<=1.001;v+=.2){svg.append(node('line',{x1:p.left,x2:w-p.right,y1:y(v),y2:y(v),stroke:'#e1e7f0'}));svg.append(node('text',{x:p.left-8,y:y(v)+4,'text-anchor':'end'},v.toFixed(1)))}
 const read=(r,k)=>MODE==='public'?r[u.metric]:r[k]?.[u.metric];
 for(const [k,color]of keys){let path='';for(let i=0;i<rows.length;i++){const v=read(rows[i],k);if(typeof v!=='number'||!Number.isFinite(v)){if(path&&MODE!=='public')svg.append(node('path',{d:path,stroke:color,'stroke-width':2.5,fill:'none'}));path='';continue}path+=(path?'L':'M')+x(i)+' '+y(v)+' '}
  if(path&&MODE!=='public')svg.append(node('path',{d:path,stroke:color,'stroke-width':2.5,fill:'none'}));
  rows.forEach((r,i)=>{const v=read(r,k);if(typeof v!=='number'||!Number.isFinite(v))return;const c=node('circle',{cx:x(i),cy:y(v),r:['ensemble','equal_probability_ensemble'].includes(r.id)?7:5,fill:color,stroke:'#fff','stroke-width':2,tabindex:0,role:'button','aria-label':`${r.label}, ${r.date.slice(0,10)}, ${k}: ${val(v)}, ${r.status}`});c.append(node('title',{},`${r.label}: ${val(v)}`));c.addEventListener('mouseenter',()=>showDetail(r));c.addEventListener('focus',()=>showDetail(r));c.addEventListener('click',()=>showDetail(r));c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showDetail(r)}});svg.append(c)})
 }
 rows.forEach((r,i)=>{let labels;if(MODE!=='public'&&rows.length<=5){labels=(w<650&&rows.length>3)?[r.id==='equal_probability_ensemble'?'Ensemble':r.id.slice(-4),r.id.startsWith('context15_')?'15s':'5s']:[r.label,r.date.slice(5,10).replace('-','/')]}else if(i===0||i===rows.length-1||i===3){labels=[r.date.slice(5,10).replace('-','/')]}else labels=[];
  for(let j=0;j<labels.length;j++){const t=node('text',{x:x(i),y:h-p.bottom+22+j*17,'text-anchor':i===0?'start':i===rows.length-1?'end':'middle'});t.textContent=labels[j];svg.append(t)}
  if(MODE==='public'&&r[u.metric]===null){svg.append(node('text',{x:x(i),y:p.top+16,'text-anchor':'end',fill:'#64748b'},'Not scored'));svg.append(node('line',{x1:x(i),x2:x(i),y1:p.top+24,y2:h-p.bottom,stroke:'#a4afc0','stroke-dasharray':'4 4'}))}
 });
 const exact=$('exact');exact.replaceChildren();const head=document.createElement('div');head.className='row';textNode('strong','Milestone',head);textNode('span',MODE==='public'?'Public':'Clean',head);textNode('span',MODE==='public'?'':'Feed-like',head);exact.append(head);
 for(const r of rows){const line=document.createElement('div');line.className='row';const label=document.createElement('span');textNode('strong',r.label,label);textNode('small',r.date.slice(0,10)+' · '+r.status,label);line.append(label);textNode('span',MODE==='public'?val(r[u.metric]):val(r.clean?.[u.metric]),line);textNode('span',MODE==='public'?'':val(r.feed_like?.[u.metric]),line);exact.append(line)}
 showDetail(rows.find(r=>r.id===selected)||rows.find(r=>['ensemble','equal_probability_ensemble'].includes(r.id))||rows.at(-1));
}
$('metric').addEventListener('change',e=>save({metric:e.target.value}));$('view').addEventListener('change',e=>{selected=null;save({view:e.target.value})});
window.addEventListener('openai:set_globals',e=>{pendingState=null;if(e.detail?.globals?.widgetState!==undefined)localState=e.detail.globals.widgetState;render()});
new ResizeObserver(()=>render()).observe($('chart'));render();
</script></body></html>
