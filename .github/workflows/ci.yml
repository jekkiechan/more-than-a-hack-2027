name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r experiments/requirements.txt
      - name: Run synthetic and contract tests
        run: python -m unittest discover -s experiments/tests -v
      - name: Validate the bundled submission format
        run: python evaluation/validate_submission.py evaluation/results/baseline_smooth50.csv
