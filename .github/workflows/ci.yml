name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            experiments/requirements.txt
            experiments/requirements-soccernet.txt
      - name: Install test dependencies
        run: python -m pip install -r experiments/requirements-soccernet.txt
      - name: Install CPU PyTorch for temporal model contract tests
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run synthetic and contract tests
        run: python -m unittest discover -s experiments/tests -v
      - name: Verify dataset expansion integrity and public-check gate contracts
        run: python -m unittest discover -s tests -v
      - name: Verify file-backed context fit parity on synthetic records
        run: python scripts/fit_context_filebacked.py --contract
      - name: Validate the bundled submission format
        run: python evaluation/validate_submission.py evaluation/results/baseline_smooth50.csv
