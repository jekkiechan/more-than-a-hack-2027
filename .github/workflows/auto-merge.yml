name: Auto-merge passing PRs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This privileged workflow deliberately does not check out or execute PR code.
      - name: Merge a current same-repository PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh api "repos/${REPOSITORY}/commits/${RUN_SHA}/pulls")
          number=$(jq -r \
            --arg repo "$REPOSITORY" \
            --arg sha "$RUN_SHA" \
            '[.[] | select(.state == "open" and .base.ref == "main" and
                           .head.sha == $sha and .head.repo.full_name == $repo)] |
             if length == 1 then .[0].number else empty end' <<<"$prs")
          if [[ -z "$number" ]]; then
            echo 'No single current same-repository PR to main for this CI run.'
            exit 0
          fi
          gh pr merge "$number" --repo "$REPOSITORY" --squash \
            --match-head-commit "$RUN_SHA"
